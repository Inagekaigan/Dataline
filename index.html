<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Dataline · Dataset cleaner</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap nav"><div class="brand"><span class="mark">▥</span> Dataline</div><span class="device"><i></i> On-device workspace</span></div></header>
<main class="wrap"><section class="intro"><div><small class="kicker">DATA PREPARATION</small><h1>Dataset cleaner<span>.</span></h1><p>Clean tabular data, inspect the changes, and export a training-ready copy.</p></div><div class="signal" aria-hidden="true"></div></section>
<section class="source" id="drop"><div class="fileicon" aria-hidden="true">▤</div><div><b id="filename"></b><small id="sourceinfo"></small></div><button id="import">↑ &nbsp; Import dataset</button><input type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values" hidden id="file"></section><p id="status" role="status"></p>
<section id="metrics" aria-label="Dataset overview"></section>
<div class="grid"><section class="panel"><div class="heading"><h2>Data preview</h2><span id="format"></span></div><div class="tools"><div class="switch"><button id="original">Original</button><button id="cleaned">Cleaned</button></div><span id="dimensions"></span></div><div class="tablewrap" tabindex="0" aria-label="Scrollable data preview"><table><thead></thead><tbody></tbody></table></div><footer><small id="range"></small><div><button id="prev" aria-label="Previous rows">‹</button><button id="next" aria-label="Next rows">›</button></div></footer></section>
<section class="panel"><div class="heading"><h2>Cleaning rules</h2></div><div id="rules"></div><div class="actions"><button id="export">↓ &nbsp; Export cleaned file</button><button id="report">Download change report</button></div></section></div>
<section class="audit"><h2>Change log</h2><div id="audit"></div></section><div class="end">CSV & TSV · Files are processed in this browser session.</div></main><script src="engine.js"></script><script src="app.js"></script></body></html>
